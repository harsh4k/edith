[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edith-terminal"
version = "0.2.0"
description = "Minimal terminal dashboard for system monitoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harshit Chauhan" }]
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17,<0.18"]  # ruff pinned: new releases change format/rules

[project.urls]
Repository = "https://github.com/harsh4k/edith"

[project.scripts]
edith = "edith:run"

[tool.setuptools]
py-modules = ["edith"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
